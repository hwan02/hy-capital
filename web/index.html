<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hy_capital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>hy_capital</title>
  <link rel="manifest" href="manifest.json">
  <!--
    첫 로딩 줄이기(2026-11-11).
    · preload — 앱 본체(main.dart.js)를 부트스트랩이 끝나길 기다리지 않고 바로 받는다.
    · preconnect — 그리기 엔진(gstatic)·글꼴·데이터 서버에 미리 연결해 둔다.
  -->
  <link rel="preload" href="main.dart.js" as="script">
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- 앱이 뜨기 전 흰 화면 대신 — 앱 배경색 + 도는 표시. 첫 화면이 그려지면 지운다. -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B0F1A; }
    #boot { position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      color: #9AA6C0; font: 600 13px system-ui, sans-serif; letter-spacing: .08em; }
    #boot i { width: 28px; height: 28px; border-radius: 50%;
      border: 3px solid #25304A; border-top-color: #F5C24B;
      animation: boot-spin .8s linear infinite; }
    @keyframes boot-spin { to { transform: rotate(360deg); } }
  </style>
  <!--
    한글 «조합 중» 파란 밑줄 없애기.

    Flutter 웹은 키 입력을 받으려고 입력칸 위에 진짜 <textarea>/<input>
    (.flt-text-editing)을 투명하게 겹쳐 둔다. 글자색은 투명이라 안 보이지만,
    맥 한글 입력기가 조합 중인 글자 밑에 긋는 밑줄은 브라우저가 따로 그려서
    파란 줄로 비쳐 보였다(앱 화면의 글자 바로 밑에 겹친다).
    Flutter 쪽 조합 밑줄은 PlainController 로 이미 지웠고, 이건 브라우저 쪽이다.
    요소 자체를 완전히 투명하게(opacity 0) 하면 무엇을 그려도 안 보인다 —
    포커스·입력·한글 조합은 그대로 된다(2026-10-06 확인).
  -->
  <style>
    /* flutter-view 안에 있는 게 보통이지만, 상황에 따라 그 밖(body 바로 아래)에
       붙기도 한다. 그때 선택자가 안 닿아 밑줄이 다시 비친다 — 범위를 묶지 않고
       한 번 더 건다(같은 요소라 중복돼도 해가 없다). 2026-10-07 */
    .flt-text-editing,
    flutter-view .flt-text-editing { opacity: 0 !important; }
  </style>
</head>
<body>
  <div id="boot"><i></i>HY CAPITAL</div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (b) b.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
