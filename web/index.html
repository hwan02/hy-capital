<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hy_capital">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hy_capital</title>
  <link rel="manifest" href="manifest.json">
  <!--
    한글 «조합 중» 파란 밑줄 없애기.

    Flutter 웹은 키 입력을 받으려고 입력칸 위에 진짜 <textarea>/<input>
    (.flt-text-editing)을 투명하게 겹쳐 둔다. 글자색은 투명이라 안 보이지만,
    맥 한글 입력기가 조합 중인 글자 밑에 긋는 밑줄은 브라우저가 따로 그려서
    파란 줄로 비쳐 보였다(앱 화면의 글자 바로 밑에 겹친다).
    Flutter 쪽 조합 밑줄은 PlainController 로 이미 지웠고, 이건 브라우저 쪽이다.
    요소 자체를 완전히 투명하게(opacity 0) 하면 무엇을 그려도 안 보인다 —
    포커스·입력·한글 조합은 그대로 된다(2026-10-06 확인).
  -->
  <style>
    /* flutter-view 안에 있는 게 보통이지만, 상황에 따라 그 밖(body 바로 아래)에
       붙기도 한다. 그때 선택자가 안 닿아 밑줄이 다시 비친다 — 범위를 묶지 않고
       한 번 더 건다(같은 요소라 중복돼도 해가 없다). 2026-10-07 */
    .flt-text-editing,
    flutter-view .flt-text-editing { opacity: 0 !important; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
