# 매일 아침 배치.
#
# 스크립트 주석에는 「매일 배치가 돌린다」고 적혀 있었지만 «그 배치가 없었다».
# cron 도 Actions 도 없어서 전부 손으로 돌려야 했고, 그래서 구역 단계가
# 몇 달째 옛날 값으로 남아 있었다(354 세부구역 · 조합설립인가 12곳).
#
# 내 맥이 꺼져 있어도 돌아야 하므로 GitHub Actions 에 둔다.
#
# 【시크릿 — 저장소가 «공개»라 코드에 절대 넣지 않는다】
#   Settings → Secrets and variables → Actions → New repository secret
#     AUTO_EMAIL     앱 계정 이메일      (Vercel 환경변수와 «같은 값»)
#     AUTO_PASSWORD  앱 계정 비밀번호    (Vercel 환경변수와 «같은 값»)
#     SLACK_WEBHOOK  슬랙 수신 URL       (없으면 마지막 단계만 건너뛴다)
#
# 동기화 스크립트도 이 계정을 쓴다 — 시크릿을 두 벌 관리하지 않으려고
# HY_PASSWORD 가 없으면 AUTO_PASSWORD 로 넘어간다.
#
# 【로그도 공개된다】
# 공개 저장소는 Actions 로그도 누구나 본다. 그래서 «내 물건·일정»을 화면에
# 찍는 --dry 는 쓰지 않는다. daily_slack 은 발송 모드로 돌려 결과 한 줄
# (「슬랙 전송 200 · 섹션 3개」)만 남긴다. 동기화 스크립트가 찍는 구역명·
# 단계는 서울시 공개 데이터라 남아도 상관없다.

name: 매일 동기화

on:
  schedule:
    # UTC 21:00 = KST 06:00. Actions 는 몇 분 늦게 뜰 수 있다(정상).
    - cron: '0 21 * * *'
  workflow_dispatch:        # 손으로도 돌릴 수 있게

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 세 스크립트가 다 같은 앱 계정을 쓴다 — 잡 단위로 한 번만 준다.
    env:
      AUTO_EMAIL: ${{ secrets.AUTO_EMAIL }}
      AUTO_PASSWORD: ${{ secrets.AUTO_PASSWORD }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
      # 동기화 두 개가 «바뀐 것»을 여기 한 줄씩 남기고, 슬랙이 읽어 보고한다.
      # (잡 env 에서는 runner 컨텍스트를 못 써서 고정 경로를 쓴다)
      SYNC_REPORT: /tmp/hy_sync_report.jsonl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ── 구역 단계 ────────────────────────────────────────
      # 포털은 «관리지역고시»까지, 정비몽땅은 그 뒤(조합설립인가~)를 안다.
      # 둘 다 돌려야 「매수 가능」 판정이 맞는다.
      #
      # 【한 곳이 죽어도 나머지는 돌린다】
      # 2026-09-21 배치가 이렇게 통째로 날아갔다: 서울시 포털이 해외 러너에서
      # 6분 넘게 안 열려 첫 스텝이 죽었고, «그 바람에» 정비몽땅 동기화도
      # 슬랙 알림도 아예 실행되지 않았다. 셋은 서로 남남이다 — 정비몽땅은
      # 다른 사이트고, 슬랙은 외부 조회가 필요 없다.
      # 그래서 실패를 스텝에 «가둬두고»(continue-on-error) 뒤는 always 로
      # 돌린 다음, 맨 마지막에 잡을 빨갛게 만든다. 알림 메일은 그대로 오되
      # 그날 할 수 있는 일은 다 하고 죽는다.
      - name: 서울도시공간포털 — 구역 단계
        id: portal
        continue-on-error: true
        run: python3 scripts/sync_moa_zones.py

      - name: 정비몽땅 — 조합 단계
        id: cleanup
        if: always()
        continue-on-error: true
        run: python3 scripts/sync_cleanup.py

      # ── 알림 ─────────────────────────────────────────────
      # 동기화 «뒤»에 보내야 오늘 바뀐 단계가 반영된 알림이 간다.
      # 동기화가 실패해도 오늘 할 일은 알려줘야 한다 — always.
      # 웹훅이 없으면 보낼 곳이 없다. 배치를 «빨갛게» 만들지 않고 건너뛴다.
      # step 의 if 에서는 secrets 를 못 읽는다(Unrecognized named-value).
      # 잡 env 로 올려놓고 env 로 본다.
      - name: 슬랙 — 오늘 할 일
        if: always() && env.SLACK_WEBHOOK != ''
        # 동기화가 성공했는지도 같이 넘긴다 — 실패하면 슬랙 맨 위에 적는다.
        env:
          PORTAL_OUTCOME: ${{ steps.portal.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
        run: python3 scripts/daily_slack.py

      # ── 결과 판정 ────────────────────────────────────────
      # 위에서 실패를 삼켰으니 여기서 되살린다. 하나라도 죽었으면
      # 잡을 실패로 끝내야 알림이 오고, 조용히 썩는 일이 없다.
      - name: 동기화 결과
        if: always()
        run: |
          p='${{ steps.portal.outcome }}'
          c='${{ steps.cleanup.outcome }}'
          echo "서울도시공간포털: $p"
          echo "정비몽땅:         $c"
          if [ "$p" != 'success' ] || [ "$c" != 'success' ]; then
            echo '::error::동기화 실패 — 위 스텝 로그를 본다. 슬랙 알림은 별개로 나갔다.'
            exit 1
          fi
